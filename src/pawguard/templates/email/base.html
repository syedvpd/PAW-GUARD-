<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>PawGuard</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
    <div style="width:100%;table-layout:fixed;background-color:#0f172a;padding:32px 0;">
      <div style="max-width:600px;margin:0 auto;padding:0 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.3);">
          <tr>
            <td style="padding:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#0f172a;">
                <tr>
                  <td style="padding:28px 36px;border-bottom:3px solid #2563eb;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">PawGuard</span>
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;color:#3b82f6;letter-spacing:0.5px;">.</span>
                    <br />
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:2px;text-transform:uppercase;">RESCUE &amp; CARE</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px;background-color:#ffffff;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#0f172a;border-top:1px solid #1e293b;">
                <tr>
                  <td style="padding:28px 36px;text-align:center;">
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;color:#e2e8f0;line-height:1.6;margin:0 0 6px 0;">
                      PawGuard Rescue &amp; Care
                    </p>
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;line-height:1.6;margin:0 0 12px 0;">
                      Helping stray and rescued pets find loving homes.
                    </p>
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#64748b;line-height:1.6;margin:0;">
                      &copy; 2026 PawGuard. All rights reserved.<br />
                      You received this email because of your activity on PawGuard.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
