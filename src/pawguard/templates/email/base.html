<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>PawGuard</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;">
    <div style="width:100%;table-layout:fixed;background-color:#f4f5f7;padding:24px 0;">
      <div style="max-width:600px;margin:0 auto;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <tr>
            <td style="padding:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#1f2937;">
                <tr>
                  <td style="padding:24px 32px;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;">PawGuard</span>
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#60a5fa;letter-spacing:0.5px;">.</span>
                    <br />
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#9ca3af;letter-spacing:1.5px;text-transform:uppercase;">Animal Rescue &amp; Care</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#f8fafc;border-top:1px solid #e5e7eb;">
                <tr>
                  <td style="padding:24px 32px;text-align:center;">
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6b7280;line-height:1.6;margin:0 0 8px 0;">
                      PawGuard Animal Rescue<br />
                      Helping stray and rescued animals find loving homes.
                    </p>
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#9ca3af;line-height:1.6;margin:0;">
                      &copy; 2026 PawGuard. All rights reserved.<br />
                      You received this email because of your activity on PawGuard.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
