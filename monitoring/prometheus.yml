global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'
  - 'prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'pawguard-backend-production'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['pawguard-backend-mqri.onrender.com']
        labels:
          environment: 'production'
          app: 'pawguard-backend'

  - job_name: 'pawguard-backend-local'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          environment: 'local'
          app: 'pawguard-backend'
