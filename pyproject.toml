[project]
name = "pawguard-backend"
version = "0.1.0"
description = "PawGuard enterprise backend platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    "pyotp>=2.9.0",
    "arq>=0.26.0",
    "jinja2>=3.1.4",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "pillow>=11.0.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.17",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",
    "razorpay>=2.0.0",
    "qrcode[pil]>=8.0.0",
    "firebase-admin>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "aiosqlite>=0.20.0",
    "types-redis>=4.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "aiosqlite>=0.20.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawguard"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic DI pattern, not a bug.
# S105: triggers on non-secret string literals like token_type="bearer".
# E501: line-length formatting handled by formatter.
# S110: explicit pass in optional fallback try-except blocks.
# S311: pseudo-random numbers used for jitter/backoff, not crypto.
# SIM102: nested if blocks for schema field migrations.
ignore = ["S101", "B008", "S105", "E501", "S110", "S311", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "E402"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["arg-type", "assignment", "attr-defined", "operator", "list-item", "call-arg", "method-assign", "index", "prop-decorator"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pyotp.*", "razorpay.*", "reportlab.*", "openpyxl.*", "qrcode.*", "arq.*", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the repo root importable (`import scripts.seed_roles_and_permissions`)
# under any pytest invocation. Without this, the integration tests' top-level
# `from scripts...` imports only worked under `python -m pytest` (which puts
# the cwd on sys.path) and failed under the bare `pytest` console script used
# by CI's `uv run pytest`.
# `src` is included so tests always import the working tree's `pawguard`
# package instead of a stale snapshot left in site-packages.
pythonpath = [".", "src"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
# B101: internal invariant assertions, not security validation.
# B104: binding 0.0.0.0 for hosting platforms (Render/Docker).
# B105: false positives on enum event-type/cookie-name string literals, not secrets.
# B310: fixed https Brevo endpoint urllib audit.
skips = ["B101", "B104", "B105", "B310"]
