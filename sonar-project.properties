# SonarQube / SonarCloud project configuration for PawGuard Backend

sonar.projectKey=syedvpd_PAW-GUARD-
sonar.organization=syedvpd
sonar.projectName=PAW-GUARD-

sonar.projectVersion=1.0.0

# Language & Source directories
sonar.sources=src/pawguard
sonar.tests=tests
sonar.language=py
sonar.python.version=3.13

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report location generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions from static analysis (generated/third-party files)
sonar.exclusions=\
    alembic/**,\
    docs/**,\
    scripts/**,\
    .venv/**,\
    **/__pycache__/**

# Test exclusions
sonar.coverage.exclusions=\
    alembic/**,\
    docs/**,\
    scripts/**,\
    tests/**,\
    src/pawguard/db/migrations/**
