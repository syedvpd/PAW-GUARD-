services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./secrets:/app/secrets
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn pawguard.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m pawguard.workers.arq_worker
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./secrets:/app/secrets
