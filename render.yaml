services:
  - type: web
    name: pawguard-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install uv && uv pip install ."
    startCommand: "alembic upgrade head && uvicorn pawguard.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
