name: Alembic Migration Check

on:
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: Alembic Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pawguard
          POSTGRES_PASSWORD: pawguard
          POSTGRES_DB: pawguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U pawguard
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Apply pending migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://pawguard:pawguard@localhost:5432/pawguard_test

      - name: Check for migration drift
        run: uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://pawguard:pawguard@localhost:5432/pawguard_test
