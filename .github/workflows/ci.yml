name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  ENVIRONMENT: "test"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    name: Core Unit & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate dummy JWT keys for testing
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/private_key.pem 2048
          openssl rsa -in secrets/private_key.pem -pubout -out secrets/public_key.pem

      - name: Run Core PawGuard Unit Tests
        run: uv run pytest tests/unit/ --ignore=tests/unit/test_outbox.py --ignore=tests/unit/test_notification_governance.py --ignore=tests/unit/test_bandwidth_reduction.py --ignore=tests/unit/test_public_web_contract.py
